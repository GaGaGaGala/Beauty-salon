{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись в парикмахерский зал</title>
    <link rel="stylesheet" href="{% static 'css/service-selection.css' %}">
</head>
<body>
<div class="service-page">
    <div class="service-bloom" aria-hidden="true"></div>
    <div class="service-container">
        <div class="service-panel">

            <h1 class="service-title">Выберите парикмахерскую услугу</h1>

            <ul class="service-list">
              {% for service in services %}
                <li class="service-row">
                  <span class="service-row__name">{{ service.title }}</span>
                  <div class="service-row__meta">
                    <span class="service-row__price">{{ service.price }} руб.</span>
                    <span class="service-row__duration">{{ service.duration_minutes }} мин.</span>
                    <a class="service-choose-link" href="{% url 'catalog:booking_create' %}?service={{ service.id }}"><button type="button" class="service-choose">Выбрать</button></a>
                  </div>
                </li>
              {% empty %}
                <li class="service-empty">Услуги пока не добавлены.</li>
              {% endfor %}
            </ul>

            <div class="service-back-wrap">
              <a class="service-back" href="/catalog/free_win/">Выбрать другую процедуру</a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
