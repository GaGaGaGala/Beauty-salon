{% extends "base.html" %}
{% block content %}
<h1>Личные события</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Добавить</button>
</form>
<table border="1" cellpadding="5">
<tr><th>Название</th><th>Тип</th><th>Начало</th><th>Окончание</th><th></th></tr>
{% for e in events %}
<tr>
<td>{{ e.title }}</td><td>{{ e.get_event_type_display }}</td><td>{{ e.start_datetime }}</td><td>{{ e.end_datetime }}</td>
<td><a href="{% url 'catalog:master_event_delete' e.id %}">Удалить</a></td>
</tr>
{% endfor %}
</table>
<p><a href="{% url 'catalog:master_dashboard' %}">Назад в кабинет мастера</a></p>
{% endblock %}
